[platformio]
default_envs = bluepill_f103c8

[env]
platform = ststm32
platform_packages =
    platformio/toolchain-gccarmnoneeabi@~1.120301.0
board = blackpill_f411ce
framework = stm32cube
monitor_speed = 1000000
board_build.f_cpu = 96000000L
board_build.ldscript = linker/STM32F411CEUX_APP.ld
; APP_BASE=0x08004000, APP_LIMIT=0x08060000 => 368 KiB application.
; The resident USB CDC recovery bootloader and persistent sector layout stay unchanged.
board_upload.maximum_size = 376832

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -Isrc
    -Isrc/usb
    -DSTM32F411xE
    -DUSE_HAL_DRIVER
    -DUSER_VECT_TAB_ADDRESS
    -DVECT_TAB_OFFSET=0x00004000U
    -DUSBCON
    -DUSBD_USE_CDC
    -DUSBD_USER_REGISTER_CALLBACK=0
    -DHMI_DEMO_MODE=0
    -DHMI_LEGACY_UART=0
    -Wl,-u,_printf_float

extra_scripts =
    pre:scripts/build_provenance.py

build_src_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Wformat=2
    -Wshadow
    -Wundef

[env:blackpill_f411ce]
upload_protocol = custom
; Normal field update uses the resident AGV USB CDC bootloader. It never erases
; sectors 0-1 and commits the manifest only after full-image CRC verification.
upload_command = $PROJECT_DIR/scripts/cdc_boot_upload.py $SOURCE

[env:blackpill_f411ce_v2]
extends = env:blackpill_f411ce
build_flags =
    ${env.build_flags}
    -DBTS_WINCH_ENABLED=1

[env:blackpill_f411ce_romdfu]
extends = env:blackpill_f411ce_v2
upload_protocol = dfu
upload_command = $PROJECT_DIR/scripts/dfu_upload_blackpill.sh $SOURCE
extra_scripts = pre:scripts/usb_dfu_upload.py

[env:blackpill_f411ce_stlink]
extends = env:blackpill_f411ce_v2
upload_protocol = stlink
; Provision bootloader + relocated application + manifest without changing layout.
upload_command = $PROJECT_DIR/scripts/provision_recovery_stlink.sh

[env:blackpill_f411ce_faulttest]
extends = env:blackpill_f411ce_v2
build_flags =
    ${env.build_flags}
    -DBTS_WINCH_ENABLED=1
    -DHMI_TEST_HOOKS=1

[env:blackpill_f411cc]
extends = env
board = genericSTM32F411CC
board_build.f_cpu = 96000000L
board_build.ldscript = linker/STM32F411CCUX_APP.ld
board_upload.maximum_size = 114688
build_flags =
    ${env.build_flags}
    -DBTS_WINCH_ENABLED=1
    -DBOARD_F411CC=1
    -DBUILD_APP_LIMIT=0x08020000UL
    -DPERSIST_STORAGE_BASE=0x08024000UL
    -DPERSIST_STORAGE_LIMIT=0x0802C000UL
upload_protocol = custom
upload_command = $PROJECT_DIR/scripts/cdc_boot_upload.py --target f411cc $SOURCE

[env:blackpill_f411cc_stlink]
extends = env:blackpill_f411cc
upload_protocol = custom
upload_command = $PROJECT_DIR/scripts/provision_recovery_stlink_f411cc.sh


[env:blackpill_f401cd]
extends = env
board = genericSTM32F401CD
board_build.f_cpu = 84000000L
board_build.ldscript = linker/STM32F401CDUX_APP.ld
board_upload.maximum_size = 245760
build_flags =
    -std=gnu++17
    -Isrc
    -Isrc/usb
    -DSTM32F401xE
    -DUSE_HAL_DRIVER
    -DUSER_VECT_TAB_ADDRESS
    -DVECT_TAB_OFFSET=0x00004000U
    -DUSBCON
    -DUSBD_USE_CDC
    -DUSBD_USER_REGISTER_CALLBACK=0
    -DHMI_DEMO_MODE=0
    -DHMI_LEGACY_UART=0
    -DBTS_WINCH_ENABLED=1
    -DBOARD_F401CD=1
    -DBUILD_APP_LIMIT=0x08040000UL
    -DPERSIST_STORAGE_BASE=0x08044000UL
    -DPERSIST_STORAGE_LIMIT=0x0804C000UL
    -Wl,-u,_printf_float
upload_protocol = custom
upload_command = $PROJECT_DIR/scripts/cdc_boot_upload.py --target f401cd $SOURCE

[env:blackpill_f401cd_stlink]
extends = env:blackpill_f401cd
upload_protocol = custom
upload_command = $PROJECT_DIR/scripts/provision_recovery_stlink_f401cd.sh

[env:bluepill_f103c8]
platform = ststm32
platform_packages =
    platformio/toolchain-gccarmnoneeabi@~1.120301.0
board = bluepill_f103c8
framework = stm32cube
monitor_speed = 1000000
board_build.f_cpu = 72000000L
board_build.ldscript = linker/STM32F103C8TX_APP.ld
board_upload.maximum_size = 63488
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -Oz
    -flto
    -ffunction-sections
    -fdata-sections
    -fno-exceptions
    -fno-unwind-tables
    -fno-asynchronous-unwind-tables
    -Wl,--gc-sections
    -Isrc
    -Isrc/usb
    -DSTM32F103xB
    -DBOARD_F103C8=1
    -DUSE_HAL_DRIVER
    -DHSE_VALUE=8000000U
    -DUSBD_USE_CDC
    -DUSBD_USER_REGISTER_CALLBACK=0
    -DHMI_DEMO_MODE=0
    -DHMI_LEGACY_UART=0
    -DBTS_WINCH_ENABLED=1
    -DPERSIST_STORAGE_BASE=0x0800F800UL
    -DPERSIST_STORAGE_LIMIT=0x08010000UL
build_src_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Wformat=2
    -Wshadow
    -Wundef
upload_protocol = stlink
