[platformio]
default_envs = f411_recovery_boot
build_dir = .pio-user-build

[env:f411_recovery_boot]
platform = ststm32
platform_packages =
    platformio/toolchain-gccarmnoneeabi@~1.120301.0
board = blackpill_f411ce
framework = stm32cube
upload_protocol = stlink
board_upload.maximum_size = 16384
build_flags =
    -Iinclude
    -DSTM32F411xE
    -DUSE_HAL_DRIVER
    -DUSBCON
    -DUSBD_USE_CDC
    -DUSBD_USER_REGISTER_CALLBACK=0
    -DAPP_BASE=0x08004000UL
    -DAPP_LIMIT=0x08060000UL
    -DMANIFEST_BASE=0x08060000UL
    -DMANIFEST_LIMIT=0x08064000UL
    -DSYSTEM_MEMORY=0x1FFF0000UL
    -DBOOT_REQUEST_MAGIC=0x42465544UL
    -Os
    -flto
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -Wl,--print-memory-usage

build_src_flags =
    -Wall
    -Wextra
    -Werror
    -Wshadow
    -Wundef

[env:f411cc_recovery_boot]
platform = ststm32
platform_packages =
    platformio/toolchain-gccarmnoneeabi@~1.120301.0
board = genericSTM32F411CC
framework = stm32cube
upload_protocol = stlink
board_upload.maximum_size = 16384
build_flags =
    -Iinclude
    -DSTM32F411xE
    -DUSE_HAL_DRIVER
    -DUSBCON
    -DUSBD_USE_CDC
    -DUSBD_USER_REGISTER_CALLBACK=0
    -DAPP_BASE=0x08004000UL
    -DAPP_LIMIT=0x08020000UL
    -DMANIFEST_BASE=0x08020000UL
    -DMANIFEST_LIMIT=0x08024000UL
    -DSYSTEM_MEMORY=0x1FFF0000UL
    -DBOOT_REQUEST_MAGIC=0x42465544UL
    -DGATEWAY_BOARD_ID=0xF411CC01UL
    -DBOARD_F411CC=1
    -DAPP_LAST_SECTOR=FLASH_SECTOR_4
    -DBOOT_LAYOUT_STRING=\"AGVBL3-04000-20000\"
    -Os
    -flto
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -Wl,--print-memory-usage
build_src_flags =
    -Wall
    -Wextra
    -Werror
    -Wshadow
    -Wundef


