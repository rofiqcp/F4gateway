[platformio]
default_envs = f103_stlink

[env]
platform = ststm32
platform_packages =
    platformio/toolchain-gccarmnoneeabi@~1.120301.0
board = genericSTM32F103C8
framework = stm32cube
monitor_speed = 1000000
board_build.f_cpu = 72000000L

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -Oz
    -flto=1
    -flto-partition=none
    -ffunction-sections
    -fdata-sections
    -fno-exceptions
    -fmerge-all-constants
    -fno-unwind-tables
    -fno-asynchronous-unwind-tables
    -Wl,--gc-sections
    -Wl,--relax
    -Wl,--no-warn-rwx-segments
    -Isrc
    -Isrc/usb
    -DSTM32F103xB
    -DBOARD_F103_FAMILY=1
    -DBOARD_F103C8=1
    -DUSE_HAL_DRIVER
    -DHSE_VALUE=8000000U
    -DUSBD_USE_CDC
    -DUSBD_USER_REGISTER_CALLBACK=0
    -DHMI_DEMO_MODE=0
    -DHMI_LEGACY_UART=0
    -DBTS_WINCH_ENABLED=1
    -DPERSIST_STORAGE_BASE=0x0800F800UL
    -DPERSIST_STORAGE_LIMIT=0x08010000UL

build_src_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Wformat=2
    -Wshadow
    -Wundef

extra_scripts =
    pre:scripts/build_provenance.py

[env:f103_bootloader]
board_build.ldscript = linker/STM32F103C8TX_BOOT.ld
board_upload.maximum_size = 8192
lib_ignore =
    STM32_USB_Device_Library-Core
    STM32_USB_Device_Library-CDC
build_flags =
    -Oz
    -flto=1
    -flto-partition=none
    -ffunction-sections
    -fdata-sections
    -fmerge-all-constants
    -fno-unwind-tables
    -fno-asynchronous-unwind-tables
    -Wl,--gc-sections
    -Wl,--relax
    -Wl,--no-warn-rwx-segments
    -Wl,--print-memory-usage
    -Isrc/bootloader
    -Isrc/bootloader/usb
    -DSTM32F103xB
    -DBOARD_F103_BOOT=1
    -DF103_BUILD_BOOTLOADER=1
    -DUSE_HAL_DRIVER
    -DHSE_VALUE=8000000U
upload_protocol = custom
upload_command = $PROJECT_DIR/scripts/upload_f103_bootloader.sh $SOURCE

[env:f103_stlink]
board_build.ldscript = linker/STM32F103C8TX_USB_APP.ld
board_upload.maximum_size = 55280
build_flags =
    ${env.build_flags}
    -DUSER_VECT_TAB_ADDRESS
    -DVECT_TAB_OFFSET=0x00002000U
    -DBOARD_F103_USBBOOT=1
upload_protocol = custom
upload_command = $PROJECT_DIR/scripts/provision_f103_stlink.sh $SOURCE

[env:f103_usb]
board_build.ldscript = linker/STM32F103C8TX_USB_APP.ld
board_upload.maximum_size = 55280
build_flags =
    ${env.build_flags}
    -DUSER_VECT_TAB_ADDRESS
    -DVECT_TAB_OFFSET=0x00002000U
    -DBOARD_F103_USBBOOT=1
upload_protocol = custom
upload_command = $PROJECT_DIR/scripts/cdc_boot_upload.py --target f103c8 $SOURCE
