[env:f103_256k_recovery_boot]
platform = ststm32
platform_packages =
    platformio/toolchain-gccarmnoneeabi@~1.120301.0
board = genericSTM32F103RC
framework = stm32cube
upload_protocol = stlink
board_build.ldscript = linker/STM32F103_256K_BOOT.ld
board_upload.maximum_size = 16384
build_src_filter =
    +<*>
    -<main.c>
    -<isr_vectors.S>
build_flags =
    -Iinclude
    -DSTM32F103xE
    -DBOARD_F103_BOOT=1
    -DUSE_HAL_DRIVER
    -DHSE_VALUE=8000000U
    -DUSBCON
    -DUSBD_USE_CDC
    -DUSBD_USER_REGISTER_CALLBACK=0
    -Os
    -flto
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -Wl,--print-memory-usage
build_src_flags =
    -Wall
    -Wextra
    -Werror
    -Wshadow
    -Wundef
