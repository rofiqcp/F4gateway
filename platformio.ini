[platformio]
default_envs = blackpill_f411ce_neo3pro

[env]
platform = ststm32
board = blackpill_f411ce
framework = stm32cube
monitor_speed = 1000000
board_build.f_cpu = 96000000L
board_build.ldscript = linker/STM32F411CEUX_APP.ld
; APP_BASE=0x08008000, APP_LIMIT=0x08060000 => 0x58000 bytes usable.
board_upload.maximum_size = 360448

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -Iinclude
    -DSTM32F411xE
    -DUSE_HAL_DRIVER
    -DUSER_VECT_TAB_ADDRESS
    -DVECT_TAB_OFFSET=0x00008000U
    -DUSBCON
    -DUSBD_USE_CDC
    -DUSBD_USER_REGISTER_CALLBACK=0
    -DHMI_DEMO_MODE=0
    -DHMI_LEGACY_UART=0
    -Wl,-u,_printf_float

extra_scripts =
    pre:scripts/build_provenance.py

build_src_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Wformat=2
    -Wshadow
    -Wundef

[env:blackpill_f411ce]
; Compatibility/current hardware profile: NEO3 Pro on DroneCAN via MCP2515.
build_flags =
    ${env.build_flags}
    -DNEO3PRO=1
    -DF4_ESC_GATEWAY=0
upload_protocol = custom
; Normal field update uses the resident AGV USB CDC bootloader. It never erases
; sectors 0-1 and commits the manifest only after full-image CRC verification.
upload_command = $PROJECT_DIR/scripts/cdc_boot_upload.py $SOURCE
custom_usb_cdc_port = /dev/serial/by-id/usb-STMicroelectronics_BLACKPILL_F411CE_CDC_in_FS_Mode_338133833134-if00

[env:blackpill_f411ce_neo3pro]
extends = env:blackpill_f411ce
build_flags =
    ${env.build_flags}
    -DNEO3PRO=1
    -DF4_ESC_GATEWAY=0

[env:blackpill_f411ce_neo3]
extends = env:blackpill_f411ce
build_flags =
    ${env.build_flags}
    -DNEO3=1
    -DF4_ESC_GATEWAY=0

[env:blackpill_f411ce_romdfu]
extends = env:blackpill_f411ce
upload_protocol = dfu
upload_command = $PROJECT_DIR/scripts/dfu_upload_blackpill.sh $SOURCE
extra_scripts = pre:scripts/usb_dfu_upload.py

[env:blackpill_f411ce_stlink]
upload_protocol = stlink
; Never use PlatformIO's default app-only ST-Link write. The application is
; relocated to 0x08008000 and requires the resident recovery bootloader plus
; a committed validity manifest. This transaction provisions all three.
upload_command = $PROJECT_DIR/scripts/provision_recovery_stlink.sh

[env:blackpill_f411ce_faulttest]
extends = env:blackpill_f411ce
build_flags =
    ${env.build_flags}
    -DNEO3PRO=1
    -DF4_ESC_GATEWAY=0
    -DHMI_TEST_HOOKS=1
