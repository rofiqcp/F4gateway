data_imu_node:
  ros__parameters:
    port: auto
    baudrate: 921600
    auto_baud: true
    baud_probe_sec: 0.5
    auto_port_id_contains: Silicon_Labs_CP2102
    auto_port_path_contains: ''
    frame_id: imu_link
    poll_interval_ms: 5
    publish_rate_hz: 50
    data_timeout_sec: 6.0
    publish_raw: false
    debug: false
    configure_output_on_connect: true
    persist_output_config: false
    configure_algorithm_on_connect: true
    algorithm_mode: 1
    output_content_mask: 30
    output_rate_code: 8
    orientation_packet_timeout_sec: 8.0
    orientation_publish_timeout_sec: 0.5
    gyro_packet_timeout_sec: 0.35
    accel_packet_timeout_sec: 0.5
    require_fresh_gyro_for_imu_publish: true
    component_sync_max_gap_sec: 0.03
    # Parser scaling contract. Keep unverified until the exact device FSR is
    # confirmed by readback/device documentation plus six-position evidence.
    accel_full_scale_g: 16.0
    gyro_full_scale_dps: 2000.0
    range_configuration_verified: false
    timestamp_max_future_sec: 0.02
    timestamp_max_regression_sec: 0.002
    timing_status_rate_hz: 2.0
    sensor_config_retry_sec: 30.0
    orientation_reopen_sec: 20.0
    publish_orientation: true
    invert_roll: true
    invert_pitch: true
    invert_yaw: false
    yaw_sign: 1.0
    roll_offset_rad: 0.0
    pitch_offset_rad: 0.0
    yaw_offset_rad: 0.0
    magnetic_declination_radians: 0.0
    vector_x_sign: -1.0
    vector_y_sign: -1.0
    vector_z_sign: 1.0
    accel_bias:
    - 0.0010990763825818317
    - -0.0007872455352585517
    - -0.00575776350095758
    # Per-axis six-position correction; neutral until reviewed field evidence.
    accel_scale:
    - 1.0
    - 1.0
    - 1.0
    gyro_bias:
    - 0.0
    - 0.0
    - 0.0
    # Short stationary calibration is a commissioning interlock only. Stage-2
    # field certification requires the long-stationary + six-position + EMI campaign.
    calibration_level: commissioning
    field_calibration_valid: false
    field_calibration_saved_at: ''
    field_calibration_evidence_sha256: ''
    field_calibration_stationary_duration_sec: 0.0
    field_calibration_six_position_valid: false
    field_calibration_motor_interference_valid: false
    stationary_calibration_valid: false
    stationary_calibration_saved_at: 2026-09-08T18:12:00+0700
    stationary_calibration_sample_count: 164
    stationary_calibration_duration_sec: 25.0
    stationary_calibration_gyro_z_std_rps: 0.0
    stationary_calibration_accel_norm_error_mps2: 0.01110199
    stationary_calibration_min_samples: 80
    stationary_calibration_min_duration_sec: 8.0
    stationary_calibration_max_gyro_z_std_rps: 0.03
    stationary_calibration_max_accel_norm_error_mps2: 0.75
    orientation_covariance:
    - 0.0025
    - 0.0025
    - 0.0076154355
    angular_velocity_covariance:
    - 0.0009
    - 0.0009
    - 0.0004
    linear_acceleration_covariance:
    - 8.706300385203908e-05
    - 7.532525585671975e-05
    - 0.0001076978576337632
    publish_mag_tesla: false
    mag_scale_tesla_per_lsb: 0.0
    use_magnetic_yaw: false
    mag_yaw_sign: -1.0
    mag_yaw_offset_rad: 1.5451826276
    mag_yaw_filter_alpha: 0.2
    mag_yaw_max_step_rad: 0.0523598776
    mag_yaw_packet_timeout_sec: 0.5
    mag_yaw_min_norm_ut: 100.0
    mag_yaw_max_norm_ut: 1000.0
